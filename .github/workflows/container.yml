name: container

# The Dockerfile builds on a fresh machine with all seven kernels, and four tasks verify with their twins refuted in
# every kernel. The image is built and checked here, not published.
on:
  workflow_dispatch:
    inputs:
      framac_column:
        description: 'Run certificate controls and both full Frama-C columns'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, .github/workflows/container.yml]

permissions:
  contents: read

env:
  FRAMAC_CONTROL_BASE: 5828ed07aaba864a4dc4ae06ab20a4a01a5d686b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: check out the repository
        uses: actions/checkout@v4

      - name: make room for the kernels
        # the image is several GB; the runner's preinstalled SDKs are not needed here
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: build the image
        id: image
        # the layers are cached between runs, so a change to t alone rebuilds only the last layer
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: t-proof-engine
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: seven kernels, four tasks
        run: |
          start=$(date +%s)
          docker run --rm -e T_MIN_KERNELS=7 --entrypoint sh t-proof-engine -c '
            mkdir /tmp/smoke && cp t/tasks/abs.t t/tasks/gcd.t t/tasks/reverse.t t/tasks/swap_at.t /tmp/smoke/ &&
            t verify /tmp/smoke --jobs 2 --flake 3 --table /tmp/smoke.md; rc=$?; cat /tmp/smoke.md; exit $rc'
          echo "verify took $(( $(date +%s) - start )) s"
          docker images t-proof-engine

      - name: unchanged negative controls and the new certificate proof
        if: ${{ !cancelled() && inputs.framac_column && steps.image.outputs.imageid != '' }}
        run: |
          mkdir -p out/framac-binding
          chmod a+rwx out/framac-binding
          docker run --rm --memory=13g -e T_RUN_NATIVE_CERTIFICATE_TESTS=1 \
            -e PYTHONDONTWRITEBYTECODE=1 --entrypoint bash t-proof-engine -c \
            'python3 t/test_framac_certificate_binding.py && python3 t/test_framac_adapter_controls.py' \
            > out/framac-binding/native-controls.log 2>&1

      - name: check out the registered column baseline
        if: ${{ !cancelled() && inputs.framac_column && steps.image.outputs.imageid != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FRAMAC_CONTROL_BASE }}
          path: baseline-engine

      - name: full Frama-C column before the repair
        if: ${{ !cancelled() && inputs.framac_column && steps.image.outputs.imageid != '' }}
        run: |
          mkdir -p out/framac-binding && chmod a+rwx out/framac-binding
          docker run --rm --memory=13g -e T_MIN_KERNELS=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/baseline-engine:/control:ro" -v "$PWD/out/framac-binding:/evidence" \
            -w /control --entrypoint bash t-proof-engine -c '
              status=0
              python3 t/cli.py verify t/tasks --kernels framac --jobs 1 --flake 3 \
                --out /tmp/framac-base --table /evidence/baseline.md || status=$?
              test "$status" -le 1 && test -s /evidence/baseline.md' \
            > out/framac-binding/baseline.log 2>&1

      - name: full Frama-C column with the repair
        if: ${{ !cancelled() && inputs.framac_column && steps.image.outputs.imageid != '' }}
        run: |
          mkdir -p out/framac-binding && chmod a+rwx out/framac-binding
          docker run --rm --memory=13g -e T_MIN_KERNELS=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/out/framac-binding:/evidence" --entrypoint bash t-proof-engine -c '
              status=0
              python3 t/cli.py verify t/tasks --kernels framac --jobs 1 --flake 3 \
                --out /tmp/framac-repair --table /evidence/repaired.md || status=$?
              test "$status" -le 1 && test -s /evidence/repaired.md' \
            > out/framac-binding/repaired.log 2>&1

      - name: retain the column measurements
        if: ${{ always() && inputs.framac_column }}
        uses: actions/upload-artifact@v4
        with:
          name: framac-certificate-binding
          path: out/framac-binding
          retention-days: 30

      - name: diagnose a failed cell
        if: failure()
        run: |
          docker run --rm --entrypoint sh t-proof-engine -c '
            set -x
            alt-ergo --version
            why3 --version
            why3 config list-provers
            sed -n 1,60p ~/.why3.conf
            cd t && python3 t_lower_one.py 2>/dev/null || python3 cli.py lower tasks/reverse.t --kernel framac > /tmp/reverse.c
            frama-c -wp -wp-prover alt-ergo -wp-steps 20000 -wp-out /tmp/wp /tmp/reverse.c 2>&1 | tail -5
            ls -R /tmp/wp | head -20
            f=$(find /tmp/wp -name "*.why" -o -name "*.mlw" | head -1); echo "goal file: $f"
            [ -n "$f" ] && why3 prove -P Alt-Ergo "$f" 2>&1 | tail -20
            f=$(find /tmp/wp -name "*.ergo" | head -1); [ -n "$f" ] && alt-ergo "$f" 2>&1 | tail -20
            true'
